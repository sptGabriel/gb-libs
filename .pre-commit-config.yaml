default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: git@github.com:pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]
        
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]

  - repo: local
    hooks:
      - id: go-format
        name: golang formatters
        language: system
        pass_filenames: false
        entry: go
        args:
          - tool
          - golangci-lint
          - fmt
        types_or: ["go"]
        stages: [pre-commit, pre-push]

      - id: go-lint
        name: golang linters
        language: system
        pass_filenames: false
        entry: go
        args:
          - tool
          - golangci-lint
          - run
        types_or: ["go"]
        stages: [pre-commit, pre-push]