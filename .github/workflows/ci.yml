name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: Find all Go modules
        run: |
          modules=$(find . -name 'go.mod' -not -path '*/vendor/*' -exec dirname {} \; | sort | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  lint-build-test:
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Go vet
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: Go build
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go build ./...

      - name: Go test
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go test -short -count=1 -race ./...
